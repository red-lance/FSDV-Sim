# Autocross is trackdrive with one lap: same executable, different gate.
autocross_driver:
  ros__parameters:
    mission: AUTOCROSS
    cones_topic: /cones/lenient  # sim's fused /cones is never published (upstream bug)
    laps: 1
    target_speed: 4.0
    min_speed: 1.5
    max_cone_range: 14.0
    min_target_dist: 2.0
    half_track: 1.75
    cone_timeout: 0.5
    blind_stop_time: 2.0
    lap_arm_distance: 10.0
    lap_close_distance: 4.0
    accel_limit: 3.0
    brake_limit: 4.0
    kp: 1.5
    wheelbase: 1.53
    steer_limit: 0.35
    stop_speed: 0.1
    brake_hold: 1.0
